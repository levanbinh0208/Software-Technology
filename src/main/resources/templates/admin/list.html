
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý học sinh</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        .header {
            background: #1e3a5f;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            font-size: 22px;
        }

        .header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .page-title h2 {
            color: #1e3a5f;
        }

        .btn {
            display: inline-block;
            border: none;
            padding: 9px 15px;
            border-radius: 5px;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background: #1e3a5f;
        }

        .btn-primary:hover {
            background: #142a45;
        }

        .btn-warning {
            background: #f0ad4e;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .filter-box {
            background: white;
            padding: 22px;
            border-radius: 8px;
            margin-bottom: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .filter-form {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto auto;
            gap: 12px;
            align-items: end;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            outline: none;
        }

        .table-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th, td {
            padding: 13px 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #edf2f7;
            color: #1e3a5f;
            white-space: nowrap;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-active {
            background: #d1e7dd;
            color: #146c43;
        }

        .status-left {
            background: #f8d7da;
            color: #b02a37;
        }

        .action {
            display: flex;
            gap: 7px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 5px;
            margin-bottom: 18px;
        }

        .alert-success {
            background: #d1e7dd;
            color: #146c43;
        }

        .alert-error {
            background: #f8d7da;
            color: #b02a37;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 900px) {
            .filter-form {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {
            .header {
                padding: 15px 20px;
            }

            .page-title {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }

            .filter-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h2>QUẢN LÝ HỌC SINH</h2>
    <a th:href="@{/admin/dashboard}">← Trang chủ</a>
</header>

<main class="container">

    <div class="page-title">
        <h2>Danh sách học sinh nội trú</h2>

        <a th:href="@{/admin/students/create}"
           class="btn btn-primary">
            + Thêm học sinh
        </a>
    </div>

    <!-- Thông báo -->
    <div th:if="${success}"
         class="alert alert-success"
         th:text="${success}">
    </div>

    <div th:if="${error}"
         class="alert alert-error"
         th:text="${error}">
    </div>

    <!-- Bộ lọc -->
    <section class="filter-box">

        <form th:action="@{/admin/students}"
              method="get"
              class="filter-form">

            <div class="form-group">
                <label>Tìm kiếm</label>
                <input type="text"
                       name="keyword"
                       placeholder="Nhập mã hoặc tên học sinh..."
                       th:value="${keyword}">
            </div>

            <div class="form-group">
                <label>Lớp học</label>
                <select name="classId">
                    <option value="">Tất cả lớp</option>

                    <option th:each="c : ${classes}"
                            th:value="${c.classId}"
                            th:text="${c.className}"
                            th:selected="${classId != null and classId == c.classId}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Trạng thái</label>
                <select name="boardingStatus">
                    <option value="">Tất cả</option>
                    <option value="ACTIVE"
                            th:selected="${boardingStatus == 'ACTIVE'}">
                        Đang nội trú
                    </option>
                    <option value="LEFT"
                            th:selected="${boardingStatus == 'LEFT'}">
                        Đã rời nội trú
                    </option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">
                Tìm kiếm
            </button>

            <a th:href="@{/admin/students}"
               class="btn btn-secondary">
                Làm mới
            </a>

        </form>

    </section>

    <!-- Bảng danh sách -->
    <section class="table-box">

        <table>
            <thead>
            <tr>
                <th>STT</th>
                <th>Mã học sinh</th>
                <th>Họ và tên</th>
                <th>Giới tính</th>
                <th>Ngày sinh</th>
                <th>Lớp</th>
                <th>Quê quán</th>
                <th>Phụ huynh</th>
                <th>Số điện thoại</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="student, stat : ${students}">
                <td th:text="${stat.count}"></td>

                <td th:text="${student.studentCode}"></td>

                <td th:text="${student.fullName}"></td>

                <td th:text="${student.gender}"></td>

                <td th:text="${student.dateOfBirth != null
                    ? #temporals.format(student.dateOfBirth, 'dd/MM/yyyy')
                    : ''}">
                </td>

                <td th:text="${student.className}"></td>

                <td th:text="${student.hometown}"></td>

                <td th:text="${student.parentName}"></td>

                <td th:text="${student.parentPhone}"></td>

                <td>
                    <span th:if="${student.boardingStatus == 'ACTIVE'}"
                          class="status status-active">
                        Đang nội trú
                    </span>

                    <span th:if="${student.boardingStatus == 'LEFT'}"
                          class="status status-left">
                        Đã rời nội trú
                    </span>
                </td>

                <td>
                    <div class="action">

                        <a th:href="@{/admin/students/edit/{id}(id=${student.studentId})}"
                           class="btn btn-warning">
                            Sửa
                        </a>

                        <form th:action="@{/admin/students/delete/{id}(id=${student.studentId})}"
                              method="post"
                              onsubmit="return confirm('Bạn có chắc chắn muốn xóa học sinh này?')">

                            <button type="submit"
                                    class="btn btn-danger">
                                Xóa
                            </button>

                        </form>

                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(students)}">
                <td colspan="11" class="empty">
                    Không tìm thấy học sinh nào.
                </td>
            </tr>

            </tbody>
        </table>

    </section>

</main>

</body>
</html>
